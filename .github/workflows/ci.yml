name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: Модульные тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Браузер для проверок
        run: npx playwright install --with-deps chromium
      - name: Запуск собранной версии
        run: |
          nohup npx vite preview --port 4173 > preview.log 2>&1 &
          if ! npx wait-on http-get://127.0.0.1:4173/ --timeout 30000; then
            echo "::error title=preview::$(tr '\n' ' ' < preview.log | head -c 3000)"
            exit 1
          fi
      - name: Сценарии в браузере (на собранной версии)
        run: |
          set +e
          BASE_URL=http://127.0.0.1:4173/ npm run test:e2e > e2e.log 2>&1
          code=$?
          cat e2e.log
          # Журнал ещё и в аннотацию: так причину видно, не скачивая логи.
          if [ $code -ne 0 ]; then echo "::error title=e2e::$(grep -v '^OK' e2e.log | tr '\n' '|' | head -c 6000)"; fi
          exit $code
      - name: Офлайн
        run: |
          set +e
          BASE_URL=http://127.0.0.1:4173/ npm run test:offline > offline.log 2>&1
          code=$?
          cat offline.log
          if [ $code -ne 0 ]; then echo "::error title=offline::$(tr '\n' '|' < offline.log | head -c 6000)"; fi
          exit $code
      # Эталоны сняты в одном окружении, а края букв в разных сборках Chromium сглаживаются чуть иначе
      # (на раннере 0,2–1 % отличающихся пикселей, и все они — по краям букв). Поэтому здесь сравнение
      # «грубое»: снимки усредняются блоками 4×4, и сдвиг блока, другой цвет или потерянный элемент
      # по-прежнему ломают сборку. Строгая попиксельная сверка (допуск 0,1 %) — у разработчика: npm run test:visual.
      - name: Сверка с макетом
        run: |
          nohup npx vite --port 5173 > dev.log 2>&1 &
          npx wait-on http-get://127.0.0.1:5173/ --timeout 30000
          set +e
          VISUAL_MODE=coarse BASE_URL=http://127.0.0.1:5173/ npm run test:visual > visual.log 2>&1
          code=$?
          cat visual.log
          if [ $code -ne 0 ]; then echo "::error title=visual::$(grep -E '^(OK|FAIL)' visual.log | tr '\n' '|' | head -c 3000)"; fi
          exit $code
      - name: Картинки расхождений
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: .visual/
          include-hidden-files: true
          if-no-files-found: ignore
